<script>
    const API = "http://127.0.0.1:8000/api";
    let activeNoteId = null;

    async function fetchTasks() {
      try {
        const res = await fetch(`${API}/tasks`);
        const tasks = await res.json();
        const container = document.getElementById("deadlinesTicker");
        if (tasks.length === 0) {
          container.innerHTML = `<span class="italic text-slate-400">No active deadlines</span>`;
          return;
        }
        container.innerHTML = tasks.map(t => `
          <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 rounded px-2.5 py-1 whitespace-nowrap">
            <span class="w-1.5 h-1.5 rounded-full ${t.status === 'confirmed' ? 'bg-emerald-500' : 'bg-amber-500'}"></span>
            <span class="font-semibold text-slate-700">${t.title}</span>
            <span class="text-slate-400 font-mono">${t.due_date ? t.due_date.split(' ')[0] : 'undated'}</span>
          </div>
        `).join("");
      } catch (e) {
        console.error("Failed to load tasks", e);
      }
    }

    async function fetchNotes() {
      try {
        const res = await fetch(`${API}/notes`);
        const notes = await res.json();
        const container = document.getElementById("savedNotesList");
        if (notes.length === 0) {
          container.innerHTML = `<span class="text-xs text-slate-400 p-2">No notes yet. Create your first note above.</span>`;
          return;
        }
        container.innerHTML = notes.map(n => `
          <div class="relative group bg-white border border-slate-200 p-2 rounded w-44 flex-shrink-0 text-xs shadow-xs hover:border-blue-500 transition">
            <button onclick="deleteNote(event, ${n.id})" title="Delete Note" class="absolute top-1.5 right-1.5 opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 font-bold px-1 transition">✕</button>
            <div onclick="loadNote(${n.id}, ${JSON.stringify(n.content).replace(/"/g, '&quot;')})" class="cursor-pointer">
              <div class="font-semibold truncate text-slate-800 pr-3">Note #${n.id}</div>
              <div class="text-slate-500 line-clamp-2 mt-1">${n.content}</div>
            </div>
          </div>
        `).join("");
      } catch (e) {
        console.error("Failed to load notes", e);
      }
    }

    async function deleteNote(event, id) {
      event.stopPropagation();
      if (!confirm(`Delete Note #${id}?`)) return;
      try {
        await fetch(`${API}/notes/${id}`, { method: "DELETE" });
        if (activeNoteId === id) newNote();
        fetchNotes();
      } catch (e) {
        alert("Failed to delete note.");
      }
    }

    function loadNote(id, content) {
      activeNoteId = id;
      document.getElementById("noteArea").value = content;
      document.getElementById("saveStatus").innerText = `Editing Note #${id}`;
    }

    function newNote() {
      activeNoteId = null;
      document.getElementById("noteArea").value = "";
      document.getElementById("saveStatus").innerText = "New Note";
    }

    async function saveCurrentNote() {
      const content = document.getElementById("noteArea").value.trim();
      if (!content) return;
      document.getElementById("saveStatus").innerText = "Embedding & Saving...";
      
      const res = await fetch(`${API}/notes`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: activeNoteId, content })
      });
      const data = await res.json();
      activeNoteId = data.note_id;
      document.getElementById("saveStatus").innerText = `Saved & Indexed (#${data.note_id})`;
      fetchNotes();
    }

    async function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;

      const history = document.getElementById("chatHistory");
      
      // User bubble
      history.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-slate-900 text-white rounded-2xl rounded-tr-none px-4 py-2.5 max-w-md">${text}</div>
        </div>
      `;
      input.value = "";
      history.scrollTop = history.scrollHeight;

      document.getElementById("sendBtn").disabled = true;

      try {
        const res = await fetch(`${API}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();

        const badgeColors = {
          SCHEDULE: "bg-indigo-100 text-indigo-700",
          CONCEPT: "bg-blue-100 text-blue-700",
          WEB: "bg-amber-100 text-amber-700"
        };

        const scoreBadges = (data.distance_scores || []).map(s => 
          `<span class="text-[9px] bg-slate-100 text-slate-500 font-mono px-1.5 py-0.5 rounded">${s}</span>`
        ).join(" ");

        history.innerHTML += `
          <div class="flex flex-col items-start gap-1">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${badgeColors[data.intent] || 'bg-slate-100 text-slate-600'}">${data.intent}</span>
              ${scoreBadges}
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-slate-800 max-w-xl whitespace-pre-wrap">${data.reply}</div>
          </div>
        `;
        history.scrollTop = history.scrollHeight;
        
        setTimeout(fetchTasks, 1200);
      } catch (e) {
        history.innerHTML += `<div class="text-red-500 text-xs">Error communicating with backend.</div>`;
      } finally {
        document.getElementById("sendBtn").disabled = false;
      }
    }

    fetchTasks();
    fetchNotes();
  </script>
